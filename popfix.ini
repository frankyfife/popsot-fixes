; Optional settings for dx.dll (Prince of Persia: The Sands of Time PC fixes).
; Copy next to dx.dll in the game folder. Every value shown is the default.

[water]
; Strength of the water refraction relative to the Xbox version (1.0 = Xbox).
refraction=1.5

[post]
; Resolution of the full-screen blur targets: 1 = original 512x512,
; 2..4 = up to 2x..4x that (limited by the screen height).
blur_resolution=4
; 0 disables the full-screen soft-focus blur effect.
blur=1
; Width of that blur: 1 = original (a wide halo around everything, which reads
; as ghosting), auto = one texel of the enlarged targets, like an upscaling
; emulator (PCSX2) renders it.
blur_radius=auto
; 1 = the blur overlay includes the glow (bloom). The original copies the frame
; before the glow, which leaves a grey ghost inside every glowing area.
blur_after_glow=1

[menus]
; 1 = Xbox console menus instead of the PC menus (experimental: saving and
; loading from the console pages is incomplete on PC).
console=0
; Moves the camera of the main-menu 3D scene forward and up (world units, 0 =
; original), so wide screens do not show the empty edges of the set. In the main
; menu, F6 / F7 move it closer / further (steps of 0.5), Shift+F6 / Shift+F7
; down / up and Ctrl+F6 / Ctrl+F7 left / right (steps of 0.25); the values go to
; popfix.log.
camera_forward=3.5
camera_up=6.25
camera_side=0

[controller]
; Button names in tutorial and menu texts: auto = controller buttons while a
; controller is connected, controller = always, keyboard = the game's key names.
prompts=auto
; Free camera: Back (View) or F9 toggles it. Left stick / WASD move, right
; stick / arrow keys look, LT / RT or Q / E down / up, hold LB / Ctrl for slow
; and RB / Shift for fast, Y / P freezes the world. The game gets no input while
; it is on.

[video]
; 1 = show the videos with their correct aspect ratio (black bars where
; needed), 0 = stretch them over the whole screen like the original.
keep_aspect=1
; Higher-resolution videos: put <name>.mp4 (H.264; H.265/AV1 with the Windows
; codec extensions) next to Video\<name>.int. Sound still comes from the .int
; file. tools\export_videos.ps1 exports the originals for upscaling.

[sound]
; With DSOAL (dsound.dll + dsoal-aldrv.dll) in the game folder the game gets EAX
; reverb and surround output. 1 = switch 3D audio and EAX on automatically.
eax=1

[debug]
; 1 = detailed diagnostics in popfix.log (menu tracing, per-frame statistics).
verbose=0
